name: Pubblica il sito

on:
  push:
    branches: [main, "claude/photonics-ai-events-app-6yi1b7"]
    paths: ["site/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Il sito legge ./data/events.json: in produzione i dati vanno affiancati
      # alla pagina, esattamente come fa scripts/preview.py in locale.
      - name: Assembla il sito
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/events.json data/health.json _site/data/ 2>/dev/null || true
          ls -la _site _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
