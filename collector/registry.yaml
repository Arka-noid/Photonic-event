# Registro delle fonti.
#
# ATTENZIONE — stato di validazione: i selettori CSS e diversi URL qui sotto
# NON sono stati verificati contro i siti veri, perché la rete dell'ambiente in
# cui è stato scritto il progetto non raggiunge i domini delle società
# scientifiche (403 dal proxy). Vanno tarati con:
#
#     python -m collector.run probe
#
# lanciato da GitHub Actions (workflow "Raccolta eventi", input mode=probe), che
# salva le risposte grezze come artifact. Finché una fonte non è verificata,
# `verified: false` lo dichiara, e health.json mostra a colpo d'occhio quali
# funzionano davvero.
#
# type: ics | rss | html | aideadlines | watchlist | llm

- id: watchlist
  name: Watchlist curata (eventi ricorrenti noti)
  type: watchlist
  path: data/watchlist.yaml
  enrich: true          # legge la pagina ufficiale per confermare date e scadenze
  enabled: true
  verified: true

- id: ai-deadlines
  name: ai-deadlines (conferences.yml)
  type: aideadlines
  url: https://raw.githubusercontent.com/paperswithcode/ai-deadlines/gh-pages/_data/conferences.yml
  fixture: tests/fixtures/sample_aideadlines.yml
  topics_default: [ml]
  enabled: true
  verified: true        # raggiungibilità e formato verificati; contenuto però datato

- id: wikicfp-photonics
  name: WikiCFP — categoria photonics
  type: rss
  url: http://www.wikicfp.com/cfp/rss?cat=photonics
  fixture: tests/fixtures/sample_rss.xml
  topics_default: [photonics]
  is_listing: true       # il link dell\'item è la scheda, non la conferenza
  enabled: true
  verified: false

- id: wikicfp-optics
  name: WikiCFP — categoria optics
  type: rss
  url: http://www.wikicfp.com/cfp/rss?cat=optics
  topics_default: [photonics]
  is_listing: true       # il link dell\'item è la scheda, non la conferenza
  enabled: true
  verified: false

- id: wikicfp-ml
  name: WikiCFP — categoria machine learning
  type: rss
  url: http://www.wikicfp.com/cfp/rss?cat=machine%20learning
  topics_default: [ml]
  is_listing: true       # il link dell\'item è la scheda, non la conferenza
  enabled: true
  verified: false

- id: wikicfp-neural
  name: WikiCFP — categoria neural networks
  type: rss
  url: http://www.wikicfp.com/cfp/rss?cat=neural%20networks
  topics_default: [ml]
  is_listing: true       # il link dell\'item è la scheda, non la conferenza
  enabled: true
  verified: false

- id: optica-events
  name: Optica (ex OSA) — eventi
  type: html
  url: https://www.optica.org/events/
  fixture: tests/fixtures/sample_events.html
  topics_default: [photonics]
  enabled: true
  verified: false
  selectors:
    item: ".event-list__item, .events-list li, article.event"
    title: "h3, h2, .event-title"
    link: "a@href"
    date: ".event-date, .date, time"
    location: ".event-location, .location"

- id: spie-conferences
  name: SPIE — conferenze ed eventi
  type: html
  url: https://spie.org/conferences-and-exhibitions
  topics_default: [photonics]
  enabled: true
  verified: false
  selectors:
    item: ".event-item, .conference-listing li, article"
    title: "h3, h2, .title"
    link: "a@href"
    date: ".dates, .event-date, time"
    location: ".location, .venue"

- id: ieee-photonics
  name: IEEE Photonics Society — conferenze
  type: html
  url: https://www.photonicssociety.org/conferences/ieee-photonics-society-conferences
  topics_default: [photonics]
  enabled: true
  verified: false
  selectors:
    item: ".conference-item, .views-row, article"
    title: "h3, h2, .title, a"
    link: "a@href"
    date: ".date, .dates, time"
    location: ".location"

- id: eos-events
  name: European Optical Society — eventi
  type: html
  url: https://www.myeos.org/events
  topics_default: [photonics]
  enabled: true
  verified: false
  selectors:
    item: ".event, .events-list__item, article"
    title: "h3, h2, .event__title, a"
    link: "a@href"
    date: ".event__date, .date, time"
    location: ".event__location, .location"

- id: llm-search
  name: Ricerca web con Claude (opzionale)
  type: llm
  enabled: true          # si auto-disattiva se manca ANTHROPIC_API_KEY
  verified: false
  max_queries: 3
  max_searches_per_query: 4
  topics_default: []
