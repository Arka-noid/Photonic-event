# Eventi ricorrenti seguiti a mano.
#
# Ogni voce genera l'edizione *attesa* più vicina, marcata "date da confermare"
# finché la pagina ufficiale non conferma un intervallo di date dell'anno giusto.
# typical_month è il mese in cui l'evento si tiene di solito: serve a collocare
# l'attesa nel calendario, non è una data reale.
#
# Campi: name, url, typical_month (1-12), kind, topics, location, region, note.

- name: CLEO (Conference on Lasers and Electro-Optics)
  url: https://www.cleoconference.org/
  typical_month: 5
  kind: conference
  topics: [photonics]
  location: San Jose, CA, USA
  region: north-america
  note: "Congresso di riferimento su laser ed elettro-ottica, con sessioni su photonic computing."

- name: CLEO Europe / EQEC
  url: https://www.cleoeurope.org/
  typical_month: 6
  kind: conference
  topics: [photonics, quantum]
  location: Monaco di Baviera, Germania
  region: europe
  note: "Edizione europea di CLEO, congiunta con EQEC sull'ottica quantistica."

- name: OFC (Optical Fiber Communication Conference)
  url: https://www.ofcconference.org/
  typical_month: 3
  kind: conference
  topics: [photonics]
  location: San Diego, CA, USA
  region: north-america
  note: "Comunicazioni ottiche; ospita lavori su interconnessioni ottiche per AI."

- name: ECOC (European Conference on Optical Communication)
  url: https://www.ecoc.org/
  typical_month: 9
  kind: conference
  topics: [photonics]
  region: europe
  note: "Principale conferenza europea sulle comunicazioni ottiche."

